---
- name: Resolve host connection address
  set_fact:
    tc_connection_host: "{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"

- name: Resolve Neutron agent lookup key
  set_fact:
    tc_agent_key: "{{ (hostvars[inventory_hostname]['hostname'] | default(hostvars[inventory_hostname]['service_host'] | default(inventory_hostname))) | regex_replace('\\.localdomain$', '') | regex_replace('\\..*$', '') }}"

- name: Wait for ssh to be ready
  wait_for:
    port: "22"
    host: "{{ tc_connection_host }}"
    search_regex: OpenSSH
    delay: 1
  delegate_to: localhost

- name: Set agents fact
  set_fact:
    agents: "{{ hostvars['localhost'].overcloud_agents | default({}) }}"

- name: Generate interface_list
  block:
    - name: Log agent presence for current host
      debug:
        msg: "Host {{ inventory_hostname }} present in agents: {{ inventory_hostname in agents }}"

    - name: Log skip reason when host is missing in agents
      debug:
        msg: "Skipping Nic Switch and OVS mapping checks because {{ inventory_hostname }} is not present in overcloud_agents"
      when: inventory_hostname not in agents

    - name: Set interfaces fact from Nic Switch Agent
      set_fact:
        itfs_from_sriov: "{{ agents[tc_agent_key]['configurations']['device_mappings'].values() | flatten }}"
      when:
        - agents is defined
        - tc_agent_key in agents
        - agents[tc_agent_key]['configurations'] is defined
        - agents[tc_agent_key]['configurations']['device_mappings'] is defined

    - name: Set interfaces fact from OVS agent
      block:
        - name: Get OVS bridge topologies
          become: yes
          bridgeinfo:
            bridge_mappings: "{{ agents[tc_agent_key]['configurations']['bridge_mappings'] }}"
          register: brinfo

        - name: Detect linux bond interfaces
          become: yes
          linuxbond:
            brinfo: "{{ brinfo.brinfo | dict_to_items | items_to_dict }}"
          register: brinfo
          when: brinfo is not skipped

        - name: Set ovs_topology fact for OVS agent hosts
          set_fact:
            ovs_topology: "{{ brinfo.brinfo | dict_to_items | selectattr('key', 'match', interface_regex)  | list | items_to_dict }}"
          when: brinfo is not skipped

        - name: Set ovs_topology fact when bridgeinfo skipped
          set_fact:
            ovs_topology: {}
          when: brinfo is skipped

        - name: Set interfaces fact
          set_fact:
            itfs_from_ovs: "{{ ovs_topology.keys() | list }}"
      when:
        - agents is defined
        - tc_agent_key in agents
        - agents[tc_agent_key]['configurations'] is defined
        - agents[tc_agent_key]['configurations']['bridge_mappings'] is defined

- name: Set interface_list fact
  vars:
  set_fact:
    interface_list: "{{ itfs_from_sriov | default([]) | union(itfs_from_ovs | default([]) | list) }}"

- name: Collect LLDP and VF info
  become: yes
  lldp:
    interfaces: "{{ interface_list }}"
    lldp_timeout: "{{ lldp_timeout | default(30) }}"
    ovs_bridges: "{{ ovs_topology | default({}) }}"
  register: lldp
  when: interface_list | length > 0

- name: Generate topology information
  topology:
    system_name: "{{ inventory_hostname }}"
    interfaces: "{{ lldp.stdout | default('{}') }}"
    ovs_bridges: "{{ ovs_topology | default({}) }}"
  register: interfaces_json
  delegate_to: localhost
  when: interface_list | length > 0

- name: Display topology json when verbosity >= 1, skip otherwise
  debug:
    msg: "{{ interfaces_json }}"
    verbosity: 1
  when: interface_list | length > 0

- name: Create output file name
  set_fact:
    json_outfile: "{{ temp_dir }}/{{ inventory_hostname }}.json"
  when: interface_list | length > 0

- name: Write the json output
  template:
    src: output.j2
    dest: "{{ json_outfile }}"
  delegate_to: localhost
  when: interface_list | length > 0

- name: Print out the contents of the json output file when verbosity >= 1, skip otherwise
  debug:
    msg: "{{ lookup('file', '{{ json_outfile }}') }}"
    verbosity: 1
  when: interface_list | length > 0
